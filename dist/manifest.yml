description: >
  Batting (insulation) symbol for Rhino 8, like AutoCAD's BATTING linetype.
  Draw it along a polyline or turn any curve into it; it follows its base
  curve, curved walls included. Edit the base with grips, set the width, the
  shape (from zig-zag to coil) and the corners (fanned, butt or mitred) in
  the Properties panel, and cut it away inside closed exclusion curves.
