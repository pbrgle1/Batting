description: >
  Batting (insulation) symbol for Rhino 8, like AutoCAD's BATTING linetype.
  Draw it along a polyline or turn any curve into it; it follows its base
  curve, curved walls included, centred or to one side. Fill the layer
  between two curves where the thickness varies. Edit the base with grips,
  set the width, shape, spacing, corners (fanned, butt or mitred) and faces
  in the Properties panel, and cut it away inside closed exclusion curves.
  Exports to DWG as lines and arcs. Includes Grasshopper components.
